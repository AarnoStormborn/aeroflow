[project]
name = "services"
version = "0.1.0"
description = "Flights Forecasting pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars",
    "boto3",
    "pyarrow",
    "httpx",
    "python-dotenv",
    "loguru>=0.7.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyyaml>=6.0.3",
    "apscheduler>=3.11.1",
]

[dependency-groups]
dev = [
    "jupyter",
    "pytest",
    "ruff",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "RUF"]
ignore = [
    "BLE001",  # broad except is intentional for pipeline resilience
    "DTZ001",
    "DTZ007",
    "DTZ011",  # naive datetimes are deliberate in this codebase
    "RUF022",  # __all__ ordering is cosmetic
    "RUF059",  # unpacked unused vars in plotting
    "C408",    # dict() calls are readable
    "RUF012",  # mutable class attrs
    "B904",    # exception chaining is verbose; keep simple raise
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.pydocstyle]

[tool.pytest.ini_options]
pythonpath = ["."]
