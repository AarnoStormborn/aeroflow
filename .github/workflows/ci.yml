name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ingestion, feature-engineering, model-training]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Sync workspace
        run: uv sync --all-groups

      - name: Lint (${{ matrix.service }})
        run: uv run --package ${{ matrix.service }} --directory ${{ matrix.service }} ruff check .

      - name: Test (${{ matrix.service }})
        run: uv run --package ${{ matrix.service }} --directory ${{ matrix.service }} pytest -q
